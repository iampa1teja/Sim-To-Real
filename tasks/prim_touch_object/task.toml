[task]
name = "prim_touch_object"
instruction = "Touch the top of the cube and pull back"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.cube]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
mass = 0.008

[task.roles]
target = "cube"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
reachable = ["@target"]

[task.start.place.cube]
region = { workspace_inset_m = 0.020 }
yaw_deg = [0.0, 90.0]

[task.stages]
order = ["touched", "withdrawn", "success"]
success_requires_stages = ["touched"]

[task.checks.touched]
check = "ee_near"
object = "@target"
offset_m = [0.0, 0.0, 0.017]
tol_m = 0.009
contact_signal = "touch_contact"

[task.checks.away]
check = "ee_near"
object = "@target"
tol_m = 0.04
negate = true

[task.checks.withdrawn]
check = "all"
of = ["away"]

[task.checks.moved]
check = "object_displaced"
object = "@target"
min_m = 0.005

[task.checks.stable]
check = "all"
of = ["moved"]
negate = true

[task.checks.success]
check = "all"
of = ["withdrawn", "stable"]

[task.failures]
rules = [{ name = "never_touched", unless = ["touched"] }, { name = "pushed_object", if = ["moved"] }, { name = "stayed_on_object" }]

[task.expert]
speed_scale = { range = [0.60, 0.95] }
max_steps = 600
settle_steps = 5
steps = [{ skill = "set_gripper", gap_m = "closed" }, { skill = "approach", target = "@target", offset_m = [0, 0, { range = [0.045, 0.065] }] }, { skill = "touch", target = "@target", stage = "touched" }, { skill = "retreat", dz_m = { range = [0.05, 0.1] }, stage = "withdrawn" }, { skill = "wait", steps = 5, stage = "success" }]

[task.perturbations]
failure = [{ type = "stall", stages = ["touched"], steps = [600, 600] }]
recovery = [{ type = "target_offset", xy_m = [0.025, 0.05] }]

[task.physics.cube]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
