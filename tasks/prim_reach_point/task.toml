[task]
name = "prim_reach_point"
instruction = "Move the gripper to the point"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }

[task.start.goal.point]
type = "point"
z_m = [0.03, 0.15]
region = "workspace"

[task.stages]
order = ["reached", "success"]

[task.checks.reached]
check = "ee_near"
point = "@goal.point"
tol_m = 0.01

[task.checks.success]
check = "all"
of = ["reached"]

[task.failures]
rules = [{ name = "never_reached", unless = ["reached"] }, { name = "left_point" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 450
settle_steps = 5
steps = [{ skill = "reach", target = "@goal.point", stage = "reached" }, { skill = "wait", steps = 10, stage = "success" }]

[task.perturbations]
failure = [{ type = "target_offset", xy_m = [0.03, 0.06] }]
recovery = [{ type = "target_offset", xy_m = [0.03, 0.06] }]
