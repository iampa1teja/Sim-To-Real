[task]
name = "prim_push_to_region"
instruction = "Push the cube into the marked area"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.cube]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
mass = 0.008

[task.roles]
target = "cube"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
reachable = ["@target"]

[task.start.goal.area]
type = "region"
center_region = { around = "@target", distance_m = [0.07, 0.14] }
half_size_m = [0.03, 0.03]

[task.start.place.cube]
region = { workspace_inset_m = 0.045 }

[task.stages]
order = ["above", "in_place", "success"]

[task.checks.above]
check = "ee_near"
object = "@target"
offset_m = [0.0, 0.0, 0.05]
tol_m = 0.015

[task.checks.in_goal]
check = "object_in_region"
object = "@target"
region = "@goal.area"
check_z = false

[task.checks.in_place]
check = "all"
of = ["in_goal"]

[task.checks.away]
check = "ee_near"
object = "@target"
tol_m = 0.04
negate = true

[task.checks.success]
check = "all"
of = ["in_place", "away"]

[task.failures]
rules = [{ name = "not_in_goal", unless = ["in_place"] }, { name = "stayed_on_object" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 750
settle_steps = 5
steps = [{ skill = "set_gripper", gap_m = "closed" }, { skill = "reach", target = "@target", offset_m = [0, 0, 0.05], stage = "above" }, { skill = "push", target = "@target", goal = "@goal.area", stage = "in_place" }, { skill = "retreat", dz_m = { range = [0.05, 0.1] } }, { skill = "wait", steps = 5, stage = "success" }]

[task.perturbations]
failure = [{ type = "object_shift", stages = ["above"], xy_m = [0.05, 0.08] }, { type = "stall", stages = ["above"], steps = [750, 750] }]
recovery = [{ type = "target_offset", stages = ["above"], xy_m = [0.03, 0.05] }]

[task.physics.cube]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
