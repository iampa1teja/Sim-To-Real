[task]
default_variant = "teleop"
name = "pick_place_color_cube"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.small_box]
usd = "usd/Small-Box-Physics.usda"
origin = "bottom"
size_outer = [0.05, 0.05, 0.035]
inner_half_size = [0.02, 0.02]
floor_z = 0.002

[task.object_sets.cubes]
prefix = "cube"
count_max = 6
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
mass = 0.008

[task.palette]
red = [0.8, 0.05, 0.05]
green = [0.05, 0.6, 0.1]
blue = [0.05, 0.1, 0.8]
yellow = [0.9, 0.8, 0.05]
orange = [0.95, 0.4, 0.02]
purple = [0.4, 0.1, 0.6]
pink = [0.95, 0.45, 0.65]

[task.roles]
target = "cubes"
container = "small_box"

[task.holdout]
colors = ["purple"]
counts = [4]

[task.instruction_template]
texts = ["Pick up the {target.color} cube and place it in the box"]

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
count = [2, 6]
min_separation_m = 0.035
clearance_m = 0.01
reachable = ["@target", "@container"]

[task.start.place.small_box]
region = "workspace"
yaw_deg = [0.0, 90.0]

[task.start.place.cubes]
region = "workspace"
yaw_deg = [0.0, 90.0]

[task.stages]
order = ["reached", "grasped", "lifted", "over_box", "placed", "success"]

[task.stages.hold_until]
reached = "grasped"
grasped = "placed"
lifted = "placed"
over_box = "placed"

[task.checks.reached]
check = "ee_near"
object = "@target"
tol_m = 0.02

[task.checks.holding]
check = "held"
object = "@target"

[task.checks.grasped]
check = "all"
of = ["holding"]

[task.checks.raised]
check = "object_lifted"
object = "@target"
min_lift_m = 0.02

[task.checks.lifted]
check = "all"
of = ["holding", "raised"]

[task.checks.above_box]
check = "object_in_region"
object = "@target"
region = "@container.inner"
check_z = false

[task.checks.over_box]
check = "all"
of = ["holding", "above_box"]

[task.checks.in_box]
check = "object_in_region"
object = "@target"
region = "@container.inner"

[task.checks.released]
check = "held"
object = "@target"
negate = true

[task.checks.placed]
check = "all"
of = ["in_box", "released"]

[task.checks.ee_clear]
check = "ee_near"
object = "@target"
tol_m = 0.04
negate = true

[task.checks.success]
check = "all"
of = ["placed", "ee_clear"]

[task.checks.distractor_in_box]
check = "objects_in_region"
set = "cubes"
exclude = ["@target"]
region = "@container.inner"

[task.failures]
rules = [{ name = "wrong_object_placed", if = ["distractor_in_box"] }, { name = "placed_not_confirmed", if = ["placed"] }, { name = "never_reached", unless = ["reached"] }, { name = "missed_grasp", unless = ["grasped"] }, { name = "timeout_holding", if = ["holding"] }, { name = "dropped_before_box", unless = ["over_box"] }, { name = "dropped_outside" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 900
steps = [{ skill = "set_gripper", gap_m = "open" }, { skill = "approach", target = "@target", offset_m = [0, 0, { range = [0.045, 0.09] }], stage = "reached" }, { skill = "grasp", target = "@target", stage = "grasped" }, { skill = "lift", height_m = { range = [0.06, 0.1] }, stage = "lifted" }, { skill = "transport", target = "@container", height_m = { range = [0.05, 0.09] }, stage = "over_box" }, { skill = "place", target = "@container" }, { skill = "release", dwell_steps = { range = [6, 14] }, stage = "placed" }, { skill = "retreat", dz_m = { range = [0.05, 0.1] } }, { skill = "wait", steps = 30, stage = "success" }]

[task.perturbations]
failure = [{ type = "grasp_offset", weight = 2, xy_m = [0.008, 0.02] }, { type = "early_release", stages = ["lifted"], delay_steps = [5, 40] }, { type = "place_offset", xy_m = [0.025, 0.05] }, { type = "wrong_target" }, { type = "object_drop", stages = ["lifted", "over_box"], xy_jitter_m = [0.0, 0.02] }]
recovery = [{ type = "grasp_offset", xy_m = [0.008, 0.02] }, { type = "object_shift", stages = ["reached"], xy_m = [0.02, 0.05], yaw_rad = [-0.5, 0.5] }, { type = "object_drop", stages = ["lifted"], xy_jitter_m = [0.0, 0.02] }, { type = "container_shift", stages = ["lifted"], xy_m = [0.02, 0.05] }]

[task.physics.cubes]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
