[task]
name = "stack_two_cubes"
instruction = "Stack the red cube on the blue cube"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.red_cube]
color = [0.8, 0.05, 0.05]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.025, 0.025, 0.025]]
mass = 0.008

[task.objects.blue_cube]
color = [0.05, 0.1, 0.8]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.025, 0.025, 0.025]]
mass = 0.008

[task.roles]
target = "red_cube"
base = "blue_cube"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.10 }
min_separation_m = 0.06
clearance_m = 0.01
reachable = ["@target", "@base"]

[task.start.place.red_cube]
region = { workspace_inset_m = 0.012 }
yaw_deg = [0.0, 90.0]

[task.start.place.blue_cube]
region = { workspace_inset_m = 0.012 }
yaw_deg = [0.0, 90.0]

[task.stages]
order = ["reached", "grasped", "lifted", "over_base", "stacked", "success"]

[task.stages.hold_until]
reached = "grasped"
grasped = "stacked"
lifted = "stacked"

[task.checks.reached]
check = "ee_near"
object = "@target"
tol_m = 0.02

[task.checks.holding]
check = "held"
object = "@target"

[task.checks.grasped]
check = "all"
of = ["holding"]

[task.checks.raised]
check = "object_lifted"
object = "@target"
min_lift_m = 0.01

[task.checks.lifted]
check = "all"
of = ["holding", "raised"]

[task.checks.above_base]
check = "ee_near"
object = "@base"
offset_m = [0.0, 0.0, 0.08]
tol_m = 0.03

[task.checks.over_base]
check = "all"
of = ["holding", "above_base"]

[task.checks.on_base]
check = "object_on_object"
object = "@target"
base = "@base"
xy_tol_m = 0.008

[task.checks.released]
check = "held"
object = "@target"
negate = true

[task.checks.stacked]
check = "all"
of = ["on_base", "released"]

[task.checks.ee_clear]
check = "ee_near"
object = "@target"
tol_m = 0.04
negate = true

[task.checks.success]
check = "all"
of = ["stacked", "ee_clear"]

[task.failures]
rules = [{ name = "stacked_not_confirmed", if = ["stacked"] }, { name = "never_reached", unless = ["reached"] }, { name = "missed_grasp", unless = ["grasped"] }, { name = "timeout_holding", if = ["holding"] }, { name = "dropped_before_base", unless = ["over_base"] }, { name = "fell_off_base" }]

[task.expert]
align_held = true
speed_scale = { range = [0.60, 0.95] }
max_steps = 1120
steps = [{ skill = "set_gripper", gap_m = "open" }, { skill = "approach", target = "@target", offset_m = [0, 0, { range = [0.045, 0.07] }], stage = "reached" }, { skill = "grasp", target = "@target", z_offset_m = { range = [0.002, 0.004] }, stage = "grasped" }, { skill = "lift", height_m = { range = [0.06, 0.08] }, stage = "lifted" }, { skill = "transport", target = "@base", height_m = { range = [0.05, 0.065] }, stage = "over_base" }, { skill = "place", target = "@base" }, { skill = "release", dwell_steps = { range = [6, 14] }, stage = "stacked" }, { skill = "retreat", dz_m = { range = [0.05, 0.065] } }, { skill = "wait", steps = 30, stage = "success" }]

[task.perturbations]
failure = [{ type = "grasp_offset", weight = 2, xy_m = [0.008, 0.02] }, { type = "early_release", stages = ["lifted"], delay_steps = [5, 40] }, { type = "place_offset", xy_m = [0.02, 0.04] }, { type = "object_drop", stages = ["lifted", "over_base"], xy_jitter_m = [0.0, 0.02] }]
recovery = [{ type = "grasp_offset", xy_m = [0.008, 0.02] }, { type = "object_shift", stages = ["reached"], xy_m = [0.02, 0.05], yaw_rad = [-0.5, 0.5] }, { type = "object_drop", stages = ["lifted"], xy_jitter_m = [0.0, 0.02] }]

[task.physics.red_cube]
mass_kg = [0.005, 0.012]
static_friction = [0.75, 1.0]
dynamic_friction = [0.65, 0.9]

[task.physics.blue_cube]
mass_kg = [0.005, 0.012]
static_friction = [0.75, 1.0]
dynamic_friction = [0.65, 0.9]
