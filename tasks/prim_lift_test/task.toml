[task]
name = "prim_lift_test"
instruction = "Lift the cube a little and set it down"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.cube]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
mass = 0.008

[task.roles]
target = "cube"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
reachable = ["@target"]

[task.start.place.cube]
region = "workspace"
yaw_deg = [0.0, 90.0]

[task.stages]
order = ["reached", "grasped", "tested", "set_down", "success"]
success_requires_stages = ["tested"]

[task.stages.hold_until]
grasped = "tested"

[task.checks.reached]
check = "ee_near"
object = "@target"
tol_m = 0.02

[task.checks.grasped]
check = "all"
of = ["holding"]

[task.checks.raised]
check = "object_lifted"
object = "@target"
min_lift_m = 0.007

[task.checks.tested]
check = "all"
of = ["holding", "raised"]

[task.checks.low]
check = "object_lifted"
object = "@target"
min_lift_m = 0.004
negate = true

[task.checks.set_down]
check = "all"
of = ["released", "low"]

[task.checks.success]
check = "all"
of = ["set_down", "clear"]

[task.checks.holding]
check = "held"
object = "@target"

[task.checks.released]
check = "held"
object = "@target"
negate = true

[task.checks.clear]
check = "ee_near"
object = "@target"
tol_m = 0.04
negate = true

[task.failures]
rules = [{ name = "not_set_down", if = ["tested"] }, { name = "never_reached", unless = ["reached"] }, { name = "missed_grasp", unless = ["grasped"] }, { name = "slipped" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 900
steps = [{ skill = "set_gripper", gap_m = "open" }, { skill = "approach", target = "@target", offset_m = [0, 0, { range = [0.045, 0.09] }], stage = "reached" }, { skill = "grasp", target = "@target", stage = "grasped" }, { skill = "lift", height_m = { range = [0.012, 0.02] }, stage = "tested" }, { skill = "release", dwell_steps = { range = [6, 14] }, stage = "set_down" }, { skill = "retreat", dz_m = { range = [0.05, 0.1] }, stage = "success" }]

[task.perturbations]
failure = [{ type = "stall", stages = ["tested"], steps = [900, 900] }]
recovery = [{ type = "grasp_offset", xy_m = [0.008, 0.02] }]

[task.physics.cube]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
