[task]
name = "prim_grasp_lift"
instruction = "Pick up the cube and hold it"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.cube]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
mass = 0.008

[task.roles]
target = "cube"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
reachable = ["@target"]

[task.start.place.cube]
region = "workspace"
yaw_deg = [0.0, 90.0]

[task.stages]
order = ["reached", "grasped", "lifted", "success"]

[task.stages.hold_until]
reached = "grasped"
grasped = "lifted"

[task.checks.reached]
check = "ee_near"
object = "@target"
tol_m = 0.02

[task.checks.grasped]
check = "all"
of = ["holding"]

[task.checks.raised]
check = "object_lifted"
object = "@target"
min_lift_m = 0.06

[task.checks.lifted]
check = "all"
of = ["holding", "raised"]

[task.checks.success]
check = "all"
of = ["lifted"]

[task.checks.holding]
check = "held"
object = "@target"

[task.checks.released]
check = "held"
object = "@target"
negate = true

[task.checks.clear]
check = "ee_near"
object = "@target"
tol_m = 0.04
negate = true

[task.failures]
rules = [{ name = "never_reached", unless = ["reached"] }, { name = "missed_grasp", unless = ["grasped"] }, { name = "not_lifted", unless = ["lifted"] }, { name = "dropped" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 900
steps = [{ skill = "set_gripper", gap_m = "open" }, { skill = "approach", target = "@target", offset_m = [0, 0, { range = [0.045, 0.09] }], stage = "reached" }, { skill = "grasp", target = "@target", stage = "grasped" }, { skill = "lift", height_m = { range = [0.07, 0.1] }, stage = "lifted" }, { skill = "wait", steps = 15, stage = "success" }]

[task.perturbations]
failure = [{ type = "grasp_offset", weight = 2, xy_m = [0.008, 0.02] }, { type = "early_close", delay_steps = [0, 5] }, { type = "object_drop", stages = ["lifted"], xy_jitter_m = [0.0, 0.02] }]
recovery = [{ type = "grasp_offset", xy_m = [0.008, 0.02] }, { type = "object_shift", stages = ["reached"], xy_m = [0.02, 0.05], yaw_rad = [-0.5, 0.5] }]

[task.physics.cube]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
