[task]
name = "prim_test_reach"
instruction = "Move the gripper next to the cube without touching it"
default_variant = "teleop"

[task.variants]
teleop = "env_cfg:apply_teleop"
generate = "env_cfg:apply_generate"

[task.objects.cube]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
mass = 0.008

[task.roles]
target = "cube"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
reachable = ["@target"]

[task.start.place.cube]
region = { workspace_inset_m = 0.045 }
yaw_deg = [0.0, 90.0]

[task.stages]
order = ["beside", "success"]

[task.checks.beside]
check = "ee_near"
object = "@target"
offset_m = [0.0, 0.04, 0.0]
tol_m = 0.01

[task.checks.moved]
check = "object_displaced"
object = "@target"
min_m = 0.003

[task.checks.untouched]
check = "all"
of = ["beside"]

[task.checks.success]
check = "all"
of = ["beside"]

[task.failures]
rules = [{ name = "touched_object", if = ["moved"] }, { name = "never_beside", unless = ["beside"] }, { name = "left_point" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 450
settle_steps = 5
steps = [{ skill = "reach", target = "@target", offset_m = [0.0, 0.04, { range = [0.05, 0.09] }] }, { skill = "reach", target = "@target", offset_m = [0.0, 0.04, 0.0], stage = "beside" }, { skill = "wait", steps = 10, stage = "success" }]

[task.perturbations]
failure = [{ type = "target_offset", xy_m = [0.025, 0.05] }]
recovery = [{ type = "target_offset", xy_m = [0.025, 0.05] }]

[task.physics.cube]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
