[task]
name = "pick_place_cube"
instruction = "Pick up the cube and place it in the box"
default_variant = "teleop"

[task.variants]
teleop   = "env_cfg:apply_teleop"
eval     = "env_cfg:apply_eval"
eval_dr  = "env_cfg:apply_eval_dr"
generate = "env_cfg:apply_generate"

[task.objects.white_box]
usd = "usd/White-Box-Physics.usda"
origin = "bottom"
rigid = true 
size_outer = [0.135, 0.085, 0.045]
inner_half_size = [0.065625, 0.04064896]
floor_z = 0.0018
right_offset = 0.247172813204101
front_edge_clearance = 0.0

[task.objects.blue_cube]
size = [0.02, 0.02, 0.02]
size_variants = [[0.018, 0.018, 0.018], [0.02, 0.02, 0.02], [0.022, 0.022, 0.022], [0.024, 0.024, 0.024], [0.026, 0.026, 0.026]]
rigid = true
mass = 0.008
position = [0.0, 0.0, 0.05]

[task.success]
min_lift = 0.01
warmup_steps = 30
force_threshold = 2.0
confirm_steps = 25

[task.episode]
decimation = 4
eval_steps = 450

[task.dr]
room_light_exposure_range = [-3.0, 1.0]
cube_colors = { blue = "from_setup", red = [0.8, 0.05, 0.05]}

[task.roles]
target = "blue_cube"
container = "white_box"

[task.start]
table_z_m = 0.0
initial_q = { around = "home", spread = 0.12 }
min_separation_m = 0.035
clearance_m = 0.01
reachable = ["@target", "@container"]

[task.start.place.blue_cube]
region = "workspace"
yaw_deg = [0.0, 90.0]

[task.start.place.white_box]
region = "workspace"
yaw_deg = [0.0, 180.0]

[task.stages]
order = ["reached", "grasped", "lifted", "over_box", "placed", "success"]

[task.failures]
rules = [{ name = "placed_not_confirmed", if = ["placed"] }, { name = "never_reached", unless = ["reached"] }, { name = "missed_grasp", unless = ["grasped"] }, { name = "timeout_holding", if = ["holding"] }, { name = "dropped_before_box", unless = ["over_box"] }, { name = "dropped_outside" }]

[task.expert]
speed_scale = { range = [0.6, 1.0] }
max_steps = 900
steps = [{ skill = "set_gripper", gap_m = "open" }, { skill = "approach", target = "@target", offset_m = [0, 0, { range = [0.045, 0.09] }], stage = "reached" }, { skill = "grasp", target = "@target", stage = "grasped" }, { skill = "lift", height_m = { range = [0.06, 0.1] }, stage = "lifted" }, { skill = "transport", target = "@container", height_m = { range = [0.05, 0.09] }, stage = "over_box" }, { skill = "place", target = "@container" }, { skill = "release", dwell_steps = { range = [6, 14] }, stage = "placed" }, { skill = "retreat", dz_m = { range = [0.05, 0.1] } }, { skill = "wait", steps = 30, stage = "success" }]

[task.perturbations]
failure = [{ type = "grasp_offset", weight = 2, xy_m = [0.008, 0.02] }, { type = "early_release", stages = ["lifted"], delay_steps = [5, 40] }, { type = "place_offset", xy_m = [0.08, 0.12] }]
recovery = [{ type = "grasp_offset", xy_m = [0.008, 0.02] }]

[task.physics.blue_cube]
mass_kg = [0.005, 0.03]
static_friction = [0.4, 1.0]
dynamic_friction = [0.3, 0.9]
