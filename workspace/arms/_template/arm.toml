# Copy this folder to workspace/arms/<name>, rename name, and supply the referenced USD.
# Non-mimic joint tables define action order; mimic followers remain physical joints.
# Limits use degrees or metres;
# initial uses radians or metres. No joint count or gripper index is assumed.
[arm]
name = "new_arm"
usd_path = "usd/arm.usda"
utils = "utils.py"

[arm.links]
base = "base"
ee = "tool"

# Optional IK tool point in the ee-link frame, in metres. Rotation errors are projected
# onto declared arm-base axes; select constraints the arm can control.
# Five arm joints: constrain position and tilt, leaving yaw free.
# [arm.ik]
# position_offset_m = [0.0, 0.0, 0.0]
# orientation_axes = ["x", "y"]
# method = "dls"                         # or "adaptive_dls"
# joint_limit_avoidance_gain = 0.0
# joint_limit_avoidance_margin = 0.3      # radians for revolute joints, metres for prismatic
#
# Six arm joints: constrain the full pose.
# [arm.ik]
# orientation_axes = ["x", "y", "z"]
# method = "dls"
#
# Seven arm joints: the spare joint permits null-space limit avoidance.
# [arm.ik]
# orientation_axes = ["x", "y", "z"]
# method = "adaptive_dls"
# joint_limit_avoidance_gain = 0.1
# joint_limit_avoidance_margin = 0.3
# A positive gain requires more arm joints than 3 + the number of orientation axes.
# The margin is one shared value for all arm joints, including mixed joint types.

[[arm.joints]]
name = "shoulder"
usd = "Shoulder"
type = "revolute"
role = "arm"
limits = [-180.0, 180.0]
initial = 0.0

[[arm.joints]]
name = "finger"
usd = "Finger"
type = "prismatic"
role = "gripper"
limits = [0.0, 0.04]
initial = 0.02

[arm.gripper]
kind = "jaw"
joints = ["finger"]
contact_bodies = ["finger_link"]
friction_bodies = ["tool", "finger_link"]
# For a parallel gripper with measured source coordinates (metres):
# closed_gap_m = 0.0
# open_gap_m = 0.08
# closed_position = 0.0
# open_position = 0.04
# closing_axis = [1.0, 0.0, 0.0]
# approach_axis = [0.0, 0.0, 1.0]
# A follower joint gets mimic = {joint = "finger", multiplier = 1.0, offset = 0.0}
# and role = "gripper", but is omitted from gripper.joints and action dimensions.
# tip_mesh = "tool_mesh"   # optional: a mesh in the end-effector visual subtree

# Omit wrist_roll entirely on arms without an independently controllable roll.
# [arm.wrist_roll]
# joint = "roll"
# relative_in_teleop = true

[arm.initial_state]
position = [0.0, 0.0, 0.0]
rotation_euler_degrees = [0.0, 0.0, 0.0]

[arm.actuators.arm]
joint_names_expr = ["Shoulder"]
effort_limit_sim = 10.0
stiffness = 20.0
damping = 1.0

[arm.actuators.gripper]
joint_names_expr = ["Finger"]
effort_limit_sim = 5.0
stiffness = 100.0
damping = 2.0

[arm.spawn]
activate_contact_sensors = false
[arm.spawn.articulation_props]
self_collision_enabled = false

[arm.lerobot]
follower_type = "your_follower_type"
leader_type = "your_leader_type"
modules = []                 # modules registering those LeRobot config classes
use_degrees = false
calibration = "factory"       # or per_unit with calibration/units/<id>.json
follower_calibration_dir = "robots/your_arm"
leader_calibration_dir = "teleoperators/your_arm"

[arm.hardware]
motor = "your_motor"
encoder_counts_per_turn = 4096
zero_count = 2048
# Factory revolute mapping uses the entire encoder count range. A factory
# prismatic joint's declared limits are its full physical stroke in metres.
