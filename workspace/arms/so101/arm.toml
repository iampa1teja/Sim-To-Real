# Arm-owned geometry, joint contract and hardware configuration.

[arm]
name = "so101"
usd_path = "usd/SO-ARM101-USD.usd"
utils = "utils.py"

[arm.links]
base = "base"
ee = "gripper"

[[arm.joints]]
name = "shoulder_pan"
usd = "Rotation"
type = "revolute"
role = "arm"
limits = [-112.88476679176092, 110.0]
initial = -0.2736

[[arm.joints]]
name = "shoulder_lift"
usd = "Pitch"
type = "revolute"
role = "arm"
limits = [-107.69922143220901, 100.93164121173322]
initial = -0.6109

[[arm.joints]]
name = "elbow_flex"
usd = "Elbow"
type = "revolute"
role = "arm"
limits = [-100.0, 93.37304708957672]
initial = -0.0745

[[arm.joints]]
name = "wrist_flex"
usd = "Wrist_Pitch"
type = "revolute"
role = "arm"
limits = [-95.0, 104.79882776625453]
initial = 1.5148

[[arm.joints]]
name = "wrist_roll"
usd = "Wrist_Roll"
type = "revolute"
role = "arm"
limits = [-180.0, 179.912109375]
initial = -0.0326036732

[[arm.joints]]
name = "gripper"
usd = "Jaw"
type = "revolute"
role = "gripper"
limits = [-15.000003814697266, 105.43359043821692]
initial = -0.1465

[arm.gripper]
kind = "jaw"
joints = ["gripper"]
contact_bodies = ["jaw"]
friction_bodies = ["gripper", "jaw"]
tip_mesh = "wrist_roll_follower_so101_v1"

[arm.wrist_roll]
joint = "wrist_roll"
relative_in_teleop = true

[arm.ik]
# A five-axis arm controls position and base-frame x/y rotation error, leaving yaw unconstrained.
orientation_axes = ["x", "y"]
# Measured fixed fingertip plus 10 mm along the closing axis: centre of a 20 mm reference grasp pocket.
# The scripted runner may override the tool offset using the arm's geometry hook for other workpiece widths.
position_offset_m = [0.00210000038146979, -0.00022491104015922092, -0.09442529333488692]

[arm.cameras]

[arm.cameras.wrist_cam]
data_types = ["rgb", "depth", "instance_id_segmentation_fast"]
parent_link = "gripper"
position = [0.00499998298523849, 0.07067375346625575, -0.00024107978488254345]
euler_degrees = [-25.016428530741678, -2.250973161482275, 2.1533965014050986]
focal_length = 18.14756233630291
horizontal_aperture = 20.955
vertical_aperture = 15.71625
width = 640
height = 480

[arm.cameras.wrist_cam.calibration]
source = "User manual tuner pick visual_matching/work/wrist-cam/manual_20261002T090057_786875Z.json (fov 60 deg, cx 315.6, cy 230.2, k1 0.164; pose = CAD seat + [2.5,-0.9,-3.0] mm, local [0,-2.95,1] deg). Geometry frozen by user; jaw-IoU gate waived (gripper sim/real calibration mismatch)."
fx = 554.2562584220408
fy = 554.2562584220408
cx = 315.6
cy = 230.2
coeffs = [0.16400000000000003, 0.0, 0.0, 0.0, 0.0]
model = "opencv_forward_brown_conrady"
convention = "OpenCV forward radial rd = ru*(1 + k1*ru^2), integer pixel centres (apply_opencv_intrinsics adds the RTX +0.5)"

[arm.cameras.wrist_cam.response]
gain = [0.8883, 1.0643, 1.2356]
offset = [0.0117, -0.001, 0.0054]
blur_sigma_px = 0.0
source = "visual_matching/work/cam_response (data-fitted per-camera residual response)"

[arm.cameras.wrist_cam.response.vignette]
k1 = -0.3804
k2 = 0.0

[arm.cameras.wrist_cam.response.noise]
a = 0.005
b = 0.02
seed = 202

[arm.appearance]
body_material = "Looks/material_a_3d_printed/Shader"
motor_material = "Looks/material_sts3215/Shader"

[arm.actuators]

[arm.actuators.rotation]
joint_names_expr = ["Rotation"]
effort_limit_sim = 30.0
stiffness = 55.0
damping = 0.7

[arm.actuators.pitch]
joint_names_expr = ["Pitch"]
effort_limit_sim = 30.0
stiffness = 30.0
damping = 0.8

[arm.actuators.elbow]
joint_names_expr = ["Elbow"]
effort_limit_sim = 30.0
stiffness = 25.0
damping = 0.7

[arm.actuators.wrist_pitch]
joint_names_expr = ["Wrist_Pitch"]
effort_limit_sim = 30.0
stiffness = 12.0
damping = 0.5

[arm.actuators.wrist_roll]
joint_names_expr = ["Wrist_Roll"]
effort_limit_sim = 30.0
stiffness = 7.0
damping = 0.5

[arm.actuators.gripper]
joint_names_expr = ["Jaw"]
effort_limit_sim = 0.3
armature = 0.000625
stiffness = 4.0
damping = 0.3

[arm.spawn]
activate_contact_sensors = false

[arm.spawn.rigid_props]
disable_gravity = false

[arm.spawn.articulation_props]
self_collision_enabled = false

[arm.initial_state]
position = [-0.05, 0.0, 0.0]
rotation_euler_degrees = [0.0, 0.0, 90.0]

[arm.lerobot]
follower_type = "so101_follower"
leader_type = "so101_leader"
use_degrees = false
follower_calibration_dir = "robots/so101_follower"
leader_calibration_dir = "teleoperators/so101_leader"
modules = ["lerobot.robots.so_follower", "lerobot.teleoperators.so_leader"]
calibration = "per_unit"

[arm.hardware]
motor = "ST3215"
encoder_counts_per_turn = 4096
zero_count = 2048

[arm.variants]

[arm.variants.contact_grasp]

[arm.variants.contact_grasp.spawn]
activate_contact_sensors = true

[arm.variants.no_camera]
usd_path = "usd/SO-ARM101-USD-NO-CAMERA.usda"
