[task]
name = "stack_bowls"
instruction = "Stack the yellow, red, and blue bowls together in any color order"
default_variant = "teleop"
variants = ["teleop", "eval"]
stages = ["reached", "grasped", "lifted", "first_bowl_stacked", "second_bowl_lifted", "all_bowls_stacked", "success"]
tracked_objects = ["yellow_bowl", "red_bowl", "blue_bowl"]

[task.start]
object = "red_bowl"
frame = "arm_base"
xy_min = [-0.22, -0.28]
xy_max = [0.18, -0.12]
yaw_deg = [0.0, 0.0]
minimum_separation_m = 0.16
minimum_base_radius_m = 0.19

[task.objects.yellow_bowl]
usd = "assets/bowl.usd"
grasp_material = true
size = [0.12, 0.12, 0.05]
mass = 0.055
frame = "arm_base"
position = [0.18, -0.12, 0.07]
color = [0.95, 0.68, 0.015]

[task.objects.red_bowl]
usd = "assets/bowl.usd"
grasp_material = true
size = [0.12, 0.12, 0.05]
mass = 0.055
frame = "arm_base"
position = [-0.05, -0.22, 0.07]
color = [0.8, 0.025, 0.025]

[task.objects.blue_bowl]
usd = "assets/bowl.usd"
grasp_material = true
size = [0.12, 0.12, 0.05]
mass = 0.055
frame = "arm_base"
position = [-0.22, -0.14, 0.07]
color = [0.025, 0.10, 0.85]

[task.episode]
decimation = 4
eval_steps = 2400

[task.appearance]
# Matte printed plastic: surface response only, with the original mesh normals.
roughness = 0.70
use_specular_workflow = 1
specular_color = [0.0, 0.0, 0.0]
clearcoat = 0.0

[task.expert]
ik_solver = "bounded"
orientation_tolerance_rad = 0.25
orientation_weight = 0.10
control_offset = [-0.0059, -0.0002249, -0.0994253]

[task.contact]
objects = ["yellow_bowl", "red_bowl", "blue_bowl"]
body_source = "friction_bodies"
literal_bodies = true
parenthesize = true
grasp_point = "arm_tcp"

[task.resets]
teleop = "starts"
params = { mode = "random", reset_robot = false }

[task.physics]
njmax = 131072
nconmax = 32768
iterations = 100
