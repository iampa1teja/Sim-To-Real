[task]
name = "stack_two_cubes"
instruction = "Stack the blue cube on top of the red cube"
default_variant = "teleop"
variants = ["teleop", "eval"]
stages = ["reached", "grasped", "lifted", "over_target", "stacked", "success"]
tracked_objects = ["cube_a", "cube_b"]

[task.start]
object = "cube_a"
frame = "arm_base"
xy_min = [0.08, -0.22]
xy_max = [0.24, -0.06]
yaw_deg = [0.0, 90.0]

[task.objects.cube_a]
spawnable = true
size = [0.02, 0.02, 0.02]
mass = 0.008
frame = "arm_base"
position = [0.14, -0.12, 0.05]
color = [0.02, 0.06, 0.9]

[task.objects.cube_b]
size = [0.02, 0.02, 0.02]
mass = 0.008
frame = "arm_base"
position = [0.20, -0.08, 0.05]
color = [0.8, 0.04, 0.03]
reset_to_default = true  # teleop: back at this pose for every new demonstration

[task.episode]
decimation = 4
eval_steps = 450
