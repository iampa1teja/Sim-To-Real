[build-system]
requires = ["setuptools", "wheel", "toml"]
build-backend = "setuptools.build_meta"

[project]
name = "sim_to_real_so101"
version = "0.1.0"
description = "How to Simulate, Train, Validate, and Deploy an End-to-End Robotics Workflow With NVIDIA Isaac - Workshop codebase"
authors = [
    { name="Lior Ben Horin", email="liorbenhorin@gmail.com" },
    { name="Shane Reetz", email="sreetz@nvidia.com" },
    { name="Maximilian Ofir", email="maxofir@nvidia.com" },
    { name="Zhijin Li", email="zhijinl@nvidia.com" }
]

# >=3.11: the Isaac Sim container (Python 3.11) pip-installs this package at start (docker/sim/entrypoint.sh).
requires-python = ">=3.11"

[dependency-groups]
# Host-side tools (uv sync). A dependency group, not [project] dependencies, so the container's
# `pip install -e` does not pull torch/transformers/lerobot into Isaac Sim's Python.
host = [
    "numpy",
    "pandas<3",
    "pyarrow",
    "torch",
    "tqdm",
    "matplotlib",
    "huggingface-hub",
    "lerobot==0.4.2",
    "transformers>=4.45,<5",
    "pytest>=9.1.1",
    "scipy",
    "opencv-python>=5.0.0.93",
]

[tool.uv]
default-groups = ["host"]
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[project.scripts]
list_envs = "sim_to_real_so101.scripts.list_envs:main"
zero_agent = "sim_to_real_so101.scripts.zero_agent:main"
random_agent = "sim_to_real_so101.scripts.random_agent:main"
lerobot_agent = "sim_to_real_so101.scripts.lerobot_agent:main"
lerobot_eval = "sim_to_real_so101.scripts.lerobot_eval:main"
lerobot_push_dataset = "sim_to_real_so101.scripts.lerobot_push_dataset:main"
pick_place_agent = "sim_to_real_so101.scripts.pick_place_agent:main"
lerobot_dr_replay = "sim_to_real_so101.scripts.dr_replay:main"
make_pick_place_eval_set = "sim_to_real_so101.scripts.make_eval_set:main"
summarize_eval_sweep = "sim_to_real_so101.scripts.summarize_sweep:main"
