services:
  serve:
    image: s2r-serve:${S2R_TAG:-latest}
    container_name: s2r-serve
    network_mode: host
    init: true
    command:
      - --policy
      - ${S2R_POLICY:?set S2R_POLICY (a folder under policies/)}
      - --checkpoint
      - /workspace/models/${S2R_CHECKPOINT:?set S2R_CHECKPOINT (path under S2R_MODELS)}
      - --port
      - ${S2R_POLICY_PORT:?set S2R_POLICY_PORT (the port your eval config connects to)}
    volumes:
      - ./policies:/policies
      - policy-cache:/opt/cache
      - ${S2R_MODELS:-~/models}:/workspace/models:ro
      - ${S2R_HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  policy-cache:
    name: policy-cache