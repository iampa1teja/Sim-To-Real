[policy]
name = "molmoact2"
description = "Official allenai/MolmoAct2 base model (multi-embodiment, post-trained), served with trust_remote_code."
enabled = true
default_port = 5556

# Versions follow github.com/allenai/molmoact2 pyproject.toml (Python 3.11-3.12, torch 2.11.0 cu128,
# transformers >=4.57,<4.58). The lockfile lives in this folder.
[environment]
python = "3.12"

[observation]
cameras = ["room", "wrist"]
language = true

[action]
default_horizon = 8
representation = "absolute_joint"

[runtime.env]
HF_HUB_OFFLINE = "1"
TRANSFORMERS_OFFLINE = "1"
PYTHONDONTWRITEBYTECODE = "1"
