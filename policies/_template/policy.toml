# Copy this folder to policies/<name>/ (or run `new_policy <name>`), then fill in every field.
# Folders whose name starts with "_" are ignored by discovery.

[policy]
name = "my_policy"            # must equal the folder name: lowercase letters, digits, underscore
description = "One line about the model and the checkpoint family it serves."
enabled = true                # false hides the policy from --policy choices and the conformance test
default_port = 5555

[environment]
python = "3.12"               # interpreter uv installs for this policy's venv
# Option A (default): the venv is built from the pyproject.toml + uv.lock next to this file.
# Option B: build it from a pinned upstream repo instead (use when the upstream lockfile matters):
# git = "https://github.com/ORG/REPO.git"
# rev = "<full 40-character commit SHA>"

[observation]
cameras = ["room", "wrist"]   # camera keys the client sends; the eval rename map must produce these
language = true               # does the model take a text instruction?

[action]
default_horizon = 8           # steps the client executes per query (<= what the model returns)
representation = "absolute_joint"   # what parse_response returns; the shared client assumes this

[runtime.env]
# Environment variables exported before the server starts, e.g.:
# HF_HUB_OFFLINE = "1"

# Optional. Leave this whole table out when the policy cannot be trained here (it then serves only).
# Each command is a script path inside this folder. The train container runs it with the repo mounted
# and these variables set by `./so101`: SO101_POLICY_DIR, SO101_DATASET, SO101_OUTPUT, SO101_BASE_MODEL.
# Arguments after the command name on the `./so101` line are passed to the script unchanged.
[train]
dataset_format = "lerobot_v2.1"   # lerobot_v2.1 or lerobot_v3: what `prepare` must hand to `train`
extras = []                       # optional dependency groups from pyproject.toml the train container adds

[train.commands]
prepare = "train/prepare.sh"      # optional: convert the recorded dataset into what `train` reads
train = "train/train.sh"          # required once [train] exists
# verify = "train/verify.sh"      # optional: check the prepared dataset before spending GPU hours
