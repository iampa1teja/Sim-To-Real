[arm]
name = "FX_ARM5L"
usd_path = "usd/fx_arm5l.usd"

[arm.links]
base = "fx5_base"
ee = "fx5_hand"
fixed_jaw_mesh = "fx5_fixed_mesh"
moving_jaw = "fx5_jaw"
moving_jaw_mesh = "fx5_moving_mesh"

[arm.joints]
names = ["fx5_pan", "fx5_lift", "fx5_elbow", "fx5_flex", "fx5_roll", "fx5_grip"]

[arm.initial_state]
position = [0.0, 0.0, 0.0]
rotation_euler_degrees = [0.0, 0.0, 0.0]

[arm.initial_state.joint_positions]
fx5_pan = 0.0
fx5_lift = -0.3
fx5_elbow = 1.6
fx5_flex = 1.2
fx5_roll = 0.0
fx5_grip = 0.5

[arm.lerobot]
follower_type = "fx_arm5_follower"
leader_type = "fx_arm5_leader"
use_degrees = false
roll_joint = "roll"
gripper_joint = "grip"
names = ["pan", "lift", "elbow", "flex", "roll", "grip"]

[arm.kinematics]
file = "kinematics.json"
ee_link = "fx5_hand"
tcp_position_m = [0.0, 0.0, 0.198]
