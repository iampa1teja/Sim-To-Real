closed_rad = 0.0
opening_table = [[0.0, 0.0], [0.25, 0.012], [0.5, 0.025], [0.75, 0.037], [1.0, 0.048]]
max_object_width_m = 0.045

[arm.expert]
arm_joints = ["fx5_pan", "fx5_lift", "fx5_elbow", "fx5_flex", "fx5_roll"]
max_joint_speed_rad_s = 1.5
max_gripper_speed_rad_s = 3.0
max_ee_speed_m_s = 0.3
ik_position_weight = 1.0
ik_axis_weight = 0.3
ik_roll_weight = 0.1
ik_tol_pos_m = 0.0005
ik_tol_rot_rad = 0.02
