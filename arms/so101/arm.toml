[arm]
name = "SO101"
usd_path = "usd/SO-ARM101-USD.usd" 

[arm.spawn]
activate_contact_sensors = false

[arm.links]
base = "base"
ee = "gripper"
fixed_jaw_mesh = "wrist_roll_follower_so101_v1"
moving_jaw = "jaw"
moving_jaw_mesh = "moving_jaw_so101_v1"

[arm.joints]
names = ["Rotation", "Pitch", "Elbow", "Wrist_Pitch", "Wrist_Roll", "Jaw"]

[arm.spawn.rigid_props]
disable_gravity = false

[arm.spawn.articulation_props]
self_collision_enabled = false

[arm.initial_state]
position = [-0.05, 0.0, 0.0]
rotation_euler_degrees = [0.0, 0.0, 90.0]   

[arm.initial_state.joint_positions]
Rotation = -0.2736
Pitch = -0.6109
Elbow = -0.0745
Wrist_Pitch = 1.5148
Wrist_Roll = -0.0326036732 
Jaw = -0.1465

[arm.actuators.rotation]
joint_names_expr = ["Rotation"]
effort_limit_sim = 30.0
stiffness = 55.0
damping = 0.7

[arm.actuators.pitch]
joint_names_expr = ["Pitch"]
effort_limit_sim = 30.0
stiffness = 30.0
damping = 0.8

[arm.actuators.elbow]
joint_names_expr = ["Elbow"]
effort_limit_sim = 30.0
stiffness = 25.0
damping = 0.7

[arm.actuators.wrist_pitch]
joint_names_expr = ["Wrist_Pitch"]
effort_limit_sim = 30.0
stiffness = 12.0
damping = 0.5

[arm.actuators.wrist_roll]
joint_names_expr = ["Wrist_Roll"]
effort_limit_sim = 30.0
stiffness = 7.0
damping = 0.5

[arm.actuators.gripper]
joint_names_expr = ["Jaw"]
effort_limit_sim = 0.3
armature = 0.000625
stiffness = 4.0
damping = 0.3

[arm.variants.contact_grasp.spawn]
activate_contact_sensors = true

[arm.variants.no_camera]
usd_path = "usd/SO-ARM101-USD-NO-CAMERA.usd"

[arm.lerobot]
follower_type = "so101_follower"
leader_type = "so101_leader"
use_degrees = false
roll_joint = "wrist_roll"        # gets the arm-to-USD zero offset (sim_joint_mapping_source)
gripper_joint = "gripper"        # gets the measured closed anchor
# Under $HF_LEROBOT_CALIBRATION. LeRobot v0.6.1 defaults to robots/so_follower/; existing files use so101_*.
follower_calibration_dir = "robots/so101_follower"
leader_calibration_dir = "teleoperators/so101_leader"
names = [
    "shoulder_pan",
    "shoulder_lift",
    "elbow_flex",
    "wrist_flex", 
    "wrist_roll", 
    "gripper"
]

[arm.hardware]
motor="ST3215"
encoder_counts_per_turn=4096
zero_count=2048

[arm.kinematics]
file = "kinematics.json"
ee_link = "gripper"
tcp_quat_wxyz = [1.0, 0.0, 0.0, 0.0]
# Measured from the simulator USD with the nominal 20 mm cube as the TCP reference.
tcp_position_m = [0.0021000003814697875, -0.00022491104015922095, -0.09442529333488683]
approach_axis = [0.0, 0.0, -1.0]
closing_axis = [1.0, 0.0, 0.0]

[arm.gripper]
joint = "Jaw"
max_object_width_m = 0.045
# Projected separation of the distal CAD surfaces along the closing axis.
# The endpoints are the simulator's lower limit and maximum projected opening.
open_rad = 1.688082260
closed_rad = -0.174532992
opening_table = [
    [-0.174532992, 0.001906356],
    [-0.058119539, 0.011114497],
    [0.058293915, 0.020015711],
    [0.174707368, 0.028502308],
    [0.291120821, 0.036778365],
    [0.407534274, 0.044251809],
    [0.523947727, 0.051506609],
    [0.640361181, 0.058444559],
    [0.756774634, 0.064971741],
    [0.873188087, 0.070728615],
    [0.989601540, 0.075743329],
    [1.106014994, 0.080113106],
    [1.222428447, 0.083778792],
    [1.338841900, 0.086690766],
    [1.455255353, 0.088809609],
    [1.571668806, 0.090106375],
    [1.688082260, 0.090528919],
]

[arm.expert]
arm_joints = ["Rotation", "Pitch", "Elbow", "Wrist_Pitch", "Wrist_Roll"]
max_joint_speed_rad_s = 1.5
max_gripper_speed_rad_s = 3.0
max_ee_speed_m_s = 0.15
ik_position_weight = 1.0
ik_axis_weight = 0.3
ik_roll_weight = 0.1
ik_tol_pos_m = 0.0005
ik_tol_rot_rad = 0.02

# WP14 §16.1: the table area the scripted generator may use (base frame). Proposed from the v3 cube and box
# placements; the owner confirms reach and camera view in the container (tests/sim/check_workspace.py).
[arm.workspace]
r_m = [0.15, 0.40]
bearing_deg = [-182.0, 2.0]
xy_min = [-0.30, -0.42]
xy_max = [0.30, 0.03]
