version = 1
joint_order = ["shoulder_pan", "shoulder_lift", "elbow_flex", "wrist_flex", "wrist_roll", "gripper"]

[preview]
margin_m = 0.02
# Operator approved on 2026-10-29: integrated end-effector mechanical interface.
mechanical_interface_exemptions = [["wrist", "jaw"]]
# Operator approved: table-mounted housing clearance is fixed at 18.6 mm.
mounted_table_exemptions = ["base", "shoulder"]
max_support_force_n = 20.0
max_support_reach_m = 0.45
max_support_height_m = 0.60

[[poses]]
name = "all-zero"
degrees = [0, 0, 0, 0, 0, 0]
[[poses]]
name = "pan-min"
degrees = [-90, 0, 0, 0, 0, 0]
[[poses]]
name = "pan-max"
degrees = [90, 0, 0, 0, 0, 0]
[[poses]]
name = "lift-min"
degrees = [0, -90, 0, 0, 0, 0]
[[poses]]
name = "lift-max"
degrees = [0, 90, 0, 0, 0, 0]
[[poses]]
name = "elbow-min"
degrees = [0, 0, -90, 0, 0, 0]
[[poses]]
name = "elbow-max"
degrees = [0, 0, 45, 0, 0, 0]
[[poses]]
name = "wrist-flex-min"
degrees = [0, 0, 0, -90, 0, 0]
[[poses]]
name = "wrist-flex-max"
degrees = [0, 0, 0, 90, 0, 0]
[[poses]]
name = "wrist-roll-min"
degrees = [0, 0, 0, 0, -135, 0]
[[poses]]
name = "wrist-roll-max"
degrees = [0, 0, 0, 0, 135, 0]
