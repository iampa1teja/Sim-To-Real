unit: rpd_robot
# MolmoAct2 base checkpoint (policies/molmoact2/setup_molmoact2.sh) on the fixed benchmark.
arm: so101
scene: rpd_meeting_room
task: pick_place_cube
variant: eval

policy:
  name: molmoact2
  checkpoint: molmoact2_base
  models_dir: /external_storage/molmoact2     # for s2r serve --models-dir; ignored by lerobot_eval
  options:
    wrist_roll_model_offset: -90     # base USD wrist degrees -> original Molmo wrist frame
    norm_tag: so100_so101_molmoact2   # normalization stats in the checkpoint's norm_stats.json
    dtype: bfloat16                   # bfloat16 (<16 GB) or float32 (~26 GB)
    num_steps: 10                     # flow-matching solver steps

eval:
  dataset: /workspace/datasets/pick_place_v1_calibrated_A
  eval_set: /workspace/s2r/tasks/pick_place_cube/eval_sets/pick_place_v1_seed1984.json
  splits: [id, ood, yaw, train]
  repeats: 1
  start_mode: cycle
  random_fraction: 0.0
  robot_start: recorded
  action_horizon: 8                   # at most the model's chunk length
  episode_length_s: 30                # 900 steps
  render_warmup: 2
  lang: Pick up the blue cube and place it in the white box
  rename_map:
    realsense_rgb: room
    wrist_cam: wrist

run:
  gui: false
  rerun: false
