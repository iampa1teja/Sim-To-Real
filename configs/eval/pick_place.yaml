# Pick-and-place evaluation. Start the server first, then run (inside s2r-sim):
#   s2r serve --policy groot_n17 --checkpoint stage_2_main/checkpoint-60000 --models-dir /external_storage/gr00t_20261011_130632 \
#       --option embodiment_tag=NEW_EMBODIMENT
#   s2r eval --config_path configs/eval/pick_place.yaml
# Any flag of lerobot_eval overrides this file. Paths are inside the s2r-sim container.

arm: so101
scene: rpd_meeting_room
task: pick_place_cube
variant: eval               # eval | eval_dr (domain randomisation)

policy:
  name: groot_n17           # folder under policies/
  checkpoint: stage_2_main/checkpoint-60000          # label in the results; the server loads it (s2r serve)
  models_dir: /external_storage/gr00t_20261011_130632   # for s2r serve --models-dir; ignored by lerobot_eval
  # host: localhost
  # port: 5555              # default: default_port from policies/<name>/policy.toml
  options:                  # client options (--policy_option); pass the same ones to s2r serve --option
    embodiment_tag: NEW_EMBODIMENT                   # must match the training checkpoint

eval:
  dataset: /workspace/datasets/pick_place_v1_calibrated_A   # recorded starts: <dataset>/pick_place_meta
  episodes: 20              # replaced by the eval set's schedule when eval_set is given
  start_mode: cycle         # cycle | random
  random_fraction: 0.0      # 0.25 opts into random starts
  robot_start: recorded     # recorded | default
  action_horizon: 16        # 1..16
  episode_length_s: 30      # 900 steps (the task default is task.toml eval_steps = 450 steps)
  render_warmup: 2          # render only the 2 steps before each policy query (0 = every step)
  eval_set: /workspace/s2r/tasks/pick_place_cube/eval_sets/pick_place_v1_seed1984.json   # fixed benchmark JSON
  splits: [id, ood, yaw, train]                                                         # needs eval_set
  repeats: 1                                                                            # needs eval_set
  lang: Pick up the blue cube and place it in the white box                             # default: task.toml instruction
  # lang_by_color:          # needs blue (and red for eval_dr)
  #   blue: Pick up the blue cube and place it in the white box
  #   red: Pick up the red cube and place it in the white box
  rename_map:               # simulator camera -> camera name the policy expects
    realsense_rgb: room
    wrist_cam: wrist
  # results_json: /workspace/s2r/outputs/eval/results.json
  # save_videos: true

# grasp:                    # gripper latch and logging (all optional)
#   gripper_latch: true
#   latch_dataset: /workspace/datasets/train
#   latch_close_below: 20
#   latch_open_above: 40
#   seed_per_episode: true
#   log_gripper: true

run:
  gui: false
  rerun: false
