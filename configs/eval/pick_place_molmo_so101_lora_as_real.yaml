unit: rpd_follower
# MolmoAct2 workshop LoRA with real-arm joint units. Smoke: s2r eval --config_path <this> --smoke-test
arm: so101
scene: rpd_meeting_room
task: pick_place_cube
variant: eval

policy:
  name: molmoact2
  checkpoint: molmoact2_so101_workshop_lora
  models_dir: /external_storage/molmoact2     # for s2r serve --models-dir; ignored by sim.eval.run
  options:
    norm_tag: workshop_pick_place_v1_as_real
    dtype: bfloat16
    action_dtype: float32
    include_original_room: false
    input_joint_units: lerobot_normalized   # scale only; no USD midpoint offsets
    num_steps: 10

eval:
  dataset: /workspace/datasets/pick_place_v1_calibrated_A
  eval_set: /workspace/s2r/tasks/pick_place_cube/eval_sets/pick_place_v1_seed1984.json
  splits: [id, ood, yaw, train]
  repeats: 1
  start_mode: cycle
  random_fraction: 0.0
  robot_start: recorded
  action_horizon: 30
  action_repeat: 1
  episode_length_s: 210
  render_warmup: 0
  video_encoder: libx264
  lang: Pick up the blue cube and place it in the white box
  rename_map:
    realsense_rgb: room
    wrist_cam: wrist

run:
  gui: false
  rerun: true

smoke_test:                           # used only with --smoke-test
  selection: one_per_zone
  reach_timeout_s: 60
  progress_timeout_s: 30
