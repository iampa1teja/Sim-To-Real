# Official SO-100/101 fine-tune of MolmoAct2 (allenai/MolmoAct2-SO100_101),
# using the original wrist neutral frame. Setup: ./scripts/setup_molmoact2.sh --variant so101
# Run with:  ./docker/eval.sh pick_place_molmo_so101.yaml [--dry_run]

task: pick_place

policy:
  name: molmoact2
  checkpoint: molmoact2_so101         # folder written by scripts/setup_molmoact2.sh --variant so101
  models_dir: /external_storage/molmoact2
  # port: 5556                        # default: default_port from policies/molmoact2/policy.toml
  server_image: policy-server:latest
  options:
    norm_tag: so100_so101_molmoact2   # normalization stats in the checkpoint's norm_stats.json
    dtype: bfloat16                   # bfloat16 (<16 GB) or float32 (~26 GB)
    num_steps: 10                     # flow-matching solver steps

# Uses the fixed benchmark starts and the corrected wrist frame for Molmo.
eval:
  dataset: /workspace/Sim-to-Real-SO-101-Workshop/datasets/pick_place_v1
  eval_set: /workspace/Sim-to-Real-SO-101-Workshop/eval_sets/pick_place_v1_seed1984.json
  splits: [id, ood, yaw, train]
  repeats: 1
  start_mode: cycle
  random_fraction: 0.0
  robot_start: recorded
  robot_usd: /workspace/Sim-to-Real-SO-101-Workshop/source/sim_to_real_so101/assets/usd/ARM_new.usd
  action_horizon: 8                   # at most the model's chunk length
  episode_length_s: 30                # 900 steps (the task default is 15 s = 450 steps)
  render_warmup: 2
  lang: Pick up the blue cube and place it in the white box
  rename_map:
    realsense_rgb: room
    wrist_cam: wrist

run:
  gui: false
  rerun: false
