services:
  sim:
    volumes:
      - /dev:/dev
      - /run/udev:/run/udev:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-~/.Xauthority}:/root/.Xauthority:ro
    
    device_cgroup_rules:
      - "c 166:* rmw"
      - "c 188:* rmw"
      - "c 81:* rmw"

    environment:
      - DISPLAY
      - TELEOP_PORT
      - TELEOP_ID
      - ROBOT_PORT
      - ROBOT_ID
      - CAMERA_GRIPPER
      - CAMERA_EXTERNAL
      - CAMERA_WIDTH
      - CAMERA_HEIGHT
      - CAMERA_FOURCC
      - CONTROL_FPS