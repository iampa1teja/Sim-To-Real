[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "s2r"
version = "0.2.0"
description = "Declarative sim-to-real: Isaac Lab 3.0 (Newton) teleop, recording and evaluation, plus the policy client/server platform."
# The sim image installs this with --no-deps into Isaac Sim's Python 3.12; Isaac Lab and LeRobot come from the image.
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# Host-side tools (uv sync) for CPU tests and result scripts; not pulled into the Isaac image.
host = [
    "numpy",
    "pandas<3",
    "pyarrow",
    "torch",
    "msgpack",
    "pyzmq",
    "draccus",
    "pytest",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cli*", "core*", "sim*"]

[project.scripts]
s2r = "cli.main:main"
